#################################
#
# Picom FT-Labs Hybrid Config
#
#################################

backend = "glx";
vsync = true;

#################################
#
# Performance
#
#################################

use-damage = true;

detect-client-opacity = true;
detect-rounded-corners = true;

mark-wmwin-focused = true;
mark-ovredir-focused = true;

use-ewmh-active-win = true;

detect-transient = true;
detect-client-leader = true;

#################################
#
# Shadows
#
#################################

shadow = true;

shadow-radius = 9;
shadow-offset-x = -9;
shadow-offset-y = -9;

shadow-opacity = 0.75;

shadow-exclude = [
  "! name~=''",

  "name = 'Notification'",
  "name *= 'picom'",
  "class_g = 'Conky'",

  "class_g ?= 'Notify-osd'",
  "class_g ?= 'Cairo-clock'",
  "class_g ?= 'Xfce4-notifyd'",

  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#
# Corners
#
#################################

corner-radius = 8;

rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
#
# Fading
#
#################################

fading = true;

fade-delta = 5;

fade-in-step = 0.03;
fade-out-step = 0.03;

#################################
#
# Opacity
#
#################################

inactive-opacity = 0.96;
active-opacity = 1.0;

frame-opacity = 0.96;

inactive-opacity-override = false;

opacity-rule = [
  "80:class_g = 'kitty'",
  "85:class_g = 'rofi'",
  "90:class_g = 'Code'",
  "80:class_g = 'Thunar'",
];

#################################
#
# Blur
#
#################################

# blur-method = "dual_kawase";
# blur-strength = 5;

# blur-background = true;
# blur-background-frame = true;
blur-background-fixed = false;

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#
# Window Types
#
#################################

wintypes:
{
  tooltip = {
    fade = true;
    shadow = true;
    opacity = 0.90;
    focus = true;
  };

  dock = {
    shadow = false;
  };

  dnd = {
    shadow = false;
  };

  popup_menu = {
    opacity = 0.95;
  };

  dropdown_menu = {
    opacity = 0.95;
  };
};

#################################
#
# Misc
#
#################################

log-level = "warn";

unredir-if-possible = false;
