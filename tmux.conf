# =============================================
# 1. CẤU HÌNH CHUNG & MÀU SẮC (HỖ TRỢ KITTY)
# =============================================
# Ép Tmux nhận màu True Color (RGB) từ Kitty
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:Tc"
set -as terminal-features ",xterm-256color:RGB"

# Đổi Prefix từ Ctrl+b sang Ctrl+a
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Bật hỗ trợ chuột
set -g mouse on

# Phím tắt chia màn hình (mở ô mới tại thư mục hiện hành)
unbind %
bind '\' split-window -h -c '#{pane_current_path}'
unbind '"'
bind - split-window -v -c '#{pane_current_path}'

# Reload cấu hình nhanh (hiện thêm thông báo cho dễ biết)
unbind r 
bind r source-file ~/.tmux.conf \; display "Đã reload tmux.conf!"

# Resize pane (Giữ Prefix + h/j/k/l)
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r h resize-pane -L 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z

# =============================================
# [MỚI THÊM] DI CHUYỂN GIỮA CÁC PANE (KHÔNG CẦN PREFIX)
# =============================================
# Sử dụng Alt + h/j/k/l (Cực nhanh)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Hoặc sử dụng Alt + Mũi tên (Dành cho ai quen phím điều hướng)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# =============================================
# Copy chuẩn Vim motions
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# Tạo window mới tại thư mục hiện tại
bind c new-window -c '#{pane_current_path}'

# Đánh số window và pane bắt đầu từ 1 (chuẩn pro)
set-option -g base-index 1
set-option -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# =============================================
# 2. QUẢN LÝ PLUGIN
# =============================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin '2kabhishek/tmux2k'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator' # [MỚI THÊM] Di chuyển xuyên suốt Neovim và Tmux

# =============================================
# 3. TMUX2K STATUS BAR (GIAO DIỆN CATPPUCCIN)
# =============================================
# Chỉ dùng theme catppuccin để lấy màu các cục pill (module)
set -g @tmux2k-theme 'catppuccin'  
set -g @tmux2k-icons-only false

# BÊN TRÁI: Session -> Git -> Cwd
set -g @tmux2k-left-plugins "session git cwd"

# BÊN PHẢI: Cpu -> Ram -> Battery -> Time
set -g @tmux2k-right-plugins "cpu ram battery time"

# Tinh chỉnh hiển thị
set -g @tmux2k-cwd-length 25
set -g @tmux2k-time-format "%H:%M"
set -g @tmux2k-window-list-alignment 'centre'
set -g @tmux2k-ram-icon ""

# =============================================
# 4. LƯU PHIÊN LÀM VIỆC TỰ ĐỘNG
# =============================================
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

# =============================================
# 5. KHỞI CHẠY TPM
# =============================================
run '~/.tmux/plugins/tpm/tpm'

# =============================================
# 6. ÉP NỀN TRONG SUỐT CHO KITTY
# Lệnh này PHẢI nằm dưới cùng (sau tpm) để xóa màu đen của plugin
# =============================================
set -g status-style bg=default
set -g message-style bg=default
