# =====================================================================
# 1. CẤU HÌNH CHUNG (GENERAL CONFIG)
# =====================================================================
# Hỗ trợ hiển thị màu sắc chính xác (True Color / 256 color)
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:Tc"
set -as terminal-features ",xterm-256color:RGB"

# Đổi phím Prefix mặc định từ Ctrl+b thành Ctrl+a
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Bật hỗ trợ chuột (click pane, cuộn chuột, resize bằng chuột)
set -g mouse on

# Đặt chỉ số cửa sổ bắt đầu từ 1 thay vì 0
set-option -g base-index 1
set-option -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Làm mới (Reload) cấu hình nhanh bằng Prefix + r
unbind r
bind r source-file ~/.tmux.conf \; display "Đã nạp lại cấu hình mặc định trong suốt!"

# =====================================================================
# 2. PHÍM TẮT THAO TÁC CỬA SỔ (PANES & WINDOWS)
# =====================================================================
# Chia pane (Giữ nguyên đường dẫn hiện tại)
unbind %
bind '\' split-window -h -c '#{pane_current_path}'
unbind '"'
bind - split-window -v -c '#{pane_current_path}'

# Tạo cửa sổ mới (Giữ nguyên đường dẫn hiện tại)
bind c new-window -c '#{pane_current_path}'

# Di chuyển giữa các pane nhanh bằng Alt + h/j/k/l (Không cần Prefix)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Thay đổi kích thước (Resize) pane bằng Prefix + H/J/K/L (Giữ Shift)
# Có thể ấn lặp lại (repeat) phím H/J/K/L để căn chỉnh thoải mái
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# =====================================================================
# 3. CHẾ ĐỘ COPY (VI COPY MODE)
# =====================================================================
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane # Giữ vùng chọn sau khi thả chuột

# =====================================================================
# 4. GIAO DIỆN & NỀN TRONG SUỐT (STYLING & TRANSPARENCY)
# =====================================================================
set -g status on

# Định dạng nội dung thanh trạng thái nguyên bản
set -g status-left "[#S] "
set -g status-right " \"#{=21:pane_title}\" %H:%M %d-%b-%y"
set -w -g window-status-format "#I:#W#F"
set -w -g window-status-current-format "#I:#W#F"

# Ép nền trong suốt (bg=default) cho toàn bộ thanh trạng thái và thông báo
set -g status-style bg=default
set -g message-style bg=default
set -w -g window-status-style fg=green,bg=default
set -w -g window-status-current-style fg=green,bold,bg=default

# =====================================================================
# 5. QUẢN LÝ PLUGIN (TMUX PLUGIN MANAGER)
# =====================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Cấu hình tự động lưu và khôi phục phiên làm việc (Continuum)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

# Khởi chạy TPM (Luôn để dòng này ở cuối cùng file)
run '~/.tmux/plugins/tpm/tpm'
